databases:
  - name: smart-trip-planner-db
    databaseName: aitripplanner
    plan: free

services:
  - type: web
    name: smart-trip-planner-web
    env: node
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && npm install"
    startCommand: "cd backend && node index.js"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-trip-planner-db
          property: connectionString
      - key: NODE_ENV
        value: production
